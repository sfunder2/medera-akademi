<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yönetim Paneli — Medera Akademi</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛠️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="top-row">
      <a class="brand" href="#/genel">
        <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect x="1" y="1" width="26" height="26" rx="8" fill="#5FD0C4"/><path d="M8 19V9l6 6 6-6v10" stroke="#16252E" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Medera Akademi <span class="badge-admin">Yönetim</span>
      </a>
      <div class="top-actions">
        <a class="icon-btn" href="./">Uygulamaya dön</a>
        <button class="icon-btn" id="themeBtn" aria-label="Tema değiştir">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <a class="icon-btn" id="userBtn" href="./#/profil" title="Profilim" hidden><span id="userName"></span></a>
        <button class="icon-btn" id="signOut" hidden>Çıkış</button>
      </div>
    </div>
    <nav class="tabs" aria-label="Yönetim menüsü" hidden>
      <a href="#/genel" data-tab="genel">Genel bakış</a>
      <a href="#/kullanicilar" data-tab="kullanicilar">Kullanıcılar<span class="badge-n" id="pendingBadge" hidden></span></a>
      <a href="#/hekimler" data-tab="hekimler">Hekimler</a>
      <a href="#/urunler" data-tab="urunler">Ürünler</a>
      <a href="#/sinavlar" data-tab="sinavlar">Sınavlar</a>
      <a href="#/mufredat" data-tab="mufredat">Müfredat</a>
      <a href="#/saha" data-tab="saha">Saha aktivitesi</a>
      <a href="#/belgeler" data-tab="belgeler">Kaynak belgeleri</a>
      <a href="#/duellosoru" data-tab="duellosoru">Düello soruları</a>
      <a href="#/duelloodul" data-tab="duelloodul">Prim ve ödüller</a>
      <a href="#/sahacalisma" data-tab="sahacalisma">Saha eğitimleri</a>
      <a href="#/beceri" data-tab="beceri">Beceri haritası</a>
      <a href="#/gecmis" data-tab="gecmis">İşlem geçmişi</a>
      <a href="#/duyurular" data-tab="duyurular">Duyurular</a>
    </nav>
  </div>
</header>
<main><div class="wrap" id="app"></div></main>
<footer><div class="wrap"><span>Medera Akademi yönetim paneli</span><span>v3.0</span></div></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="assets/shared.js"></script>
<script src="assets/features.js"></script>
<script src="assets/duels.js"></script>
<script src="assets/field-training.js"></script>
<script src="assets/admin.js"></script>
</body>
</html>
